<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Keitaro Campaign Manager</title>
    <script>
      (function () {
        // Применяем сохранённый или системный режим темы до первой отрисовки, чтобы избежать вспышки
        var modes = ["dark", "light", "system"];
        var mode = "system";
        try {
          var saved = localStorage.getItem("kcm-theme");
          if (modes.indexOf(saved) !== -1) mode = saved;
        } catch (e) {}
        var prefersLight = false;
        try {
          prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
        } catch (e) {}
        var resolved = mode === "system" ? (prefersLight ? "light" : "dark") : mode;
        document.documentElement.dataset.themeMode = mode;
        document.documentElement.dataset.theme = resolved;
        var meta = document.querySelector('meta[name="color-scheme"]');
        if (meta) meta.setAttribute("content", resolved);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
